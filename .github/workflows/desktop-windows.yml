name: Desktop Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "icons/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "icons/**"
      - ".github/workflows/desktop-windows.yml"

jobs:
  windows-amd64:
    name: Windows amd64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
          cache-key-prefix: qt-win-6.8.3-msvc2022

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          cmake -S desktop -B desktop/build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build desktop/build -j

      - name: Deploy Qt runtime
        run: |
          $exe = "desktop/build/BooruVerse.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe dist/BooruVerse.exe
          windeployqt --release --compiler-runtime --qmldir desktop/qml dist/BooruVerse.exe

      - name: Pack
        run: |
          Compress-Archive -Path dist/* -DestinationPath BooruVerse-windows-amd64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooruVerse-windows-amd64
          path: BooruVerse-windows-amd64.zip
          if-no-files-found: error
